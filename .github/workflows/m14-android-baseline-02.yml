name: M14 Android Baseline 02

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build_apk:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 476f01e1983dfe916d7ac4b8184f0c1abef86011
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install JS dependencies
        run: npm ci

      - name: Native parity contracts
        shell: pwsh
        run: |
          node --test tests/native-web-staging.test.js
          node --test tests/native-foundation.test.js
          node --test tests/android-scaffold.test.js
          node --test tests/native-back-platform.test.js
          node --test tests/native-back-navigation.test.js

      - name: Full suite
        run: npm test

      - name: Stage Capacitor web bundle
        run: npm run build:capacitor-web

      - name: Assert native bundle parity
        shell: pwsh
        run: |
          $html = Get-Content dist/capacitor/index.html -Raw
          if ($html -match 'stories\.js|stories\.css|story-archive|Apri le tue Stories|Aggiungi una story') { throw 'Stories residue found in native bundle' }
          if ($html -notmatch 'id="leftForYouPartnerEntry"') { throw 'Left for You top entry missing' }
          if ($html -notmatch 'id="leftForYouOverlay"') { throw 'Left for You inbox missing' }
          if ($html -notmatch 'id="leftForYouComposerOverlay"') { throw 'Left for You composer missing' }
          if ($html -match '__US_LEFT_FOR_YOU_RENDERER_ONLY__\s*=\s*true') { throw 'Left for You incorrectly forced to renderer-only' }

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Assemble debug APK
        working-directory: android
        run: .\gradlew.bat --no-daemon :app:assembleDebug

      - name: Package install candidate
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item android/app/build/outputs/apk/debug/app-debug.apk out/US-M14-Android-Baseline-02.apk
          $hash = (Get-FileHash out/US-M14-Android-Baseline-02.apk -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  US-M14-Android-Baseline-02.apk" | Set-Content out/US-M14-Android-Baseline-02.sha256.txt
          @"
          source_sha=476f01e1983dfe916d7ac4b8184f0c1abef86011
          base_main=52a80a1da77d41c670c208f3df9893daf288078d
          application_id=com.usapp.us
          version_name=1.0
          version_code=1
          build_type=debug
          native_parity=no-stories+left-for-you
          sha256=$hash
          "@ | Set-Content out/US-M14-Baseline-02-build-info.txt
          Get-Item out/US-M14-Android-Baseline-02.apk | Format-List Name,Length,LastWriteTime

      - uses: actions/upload-artifact@v4
        with:
          name: US-M14-Android-Baseline-02
          path: out/
          if-no-files-found: error
          retention-days: 14
