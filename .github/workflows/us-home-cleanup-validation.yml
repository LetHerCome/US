name: US Home Cleanup Validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Focused tests
        run: >
          node --test
          tests/us-home-cleanup-noi-board-daily-move.test.js
          tests/us-human-ui-02.test.js
          tests/m10-oggi-order-daily-card.test.js
          tests/m9b-daily-ritual.test.js
          tests/m12a-oggi-priority.test.js
          tests/m6e-oggi-widgets.test.js
          tests/m10-2-push-regression.test.js
          tests/m10-daily-answer-push-regression.test.js
      - name: Full test suite
        run: npm test
      - name: Cloudflare Pages build
        run: npm run build:cloudflare-pages
      - name: Capacitor web build
        run: npm run build:capacitor-web
      - name: Diff check
        run: git diff --check "${{ github.event.pull_request.base.sha }}..HEAD"
