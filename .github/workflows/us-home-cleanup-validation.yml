name: US Home Cleanup Diff Gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diff_check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Diff check
        run: git diff --check "${{ github.event.pull_request.base.sha }}..HEAD"
