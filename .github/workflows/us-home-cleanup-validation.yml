name: US Home Cleanup Final Validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Focused tests
        run: >
          node --test
          tests/us-home-cleanup-noi-board-daily-move.test.js
          tests/us-human-ui-02.test.js
          tests/copy-cleanup.test.js
          tests/m10-oggi-order-daily-card.test.js
          tests/m9b-daily-ritual.test.js
          tests/m12a-oggi-priority.test.js
          tests/m6e-oggi-widgets.test.js
          tests/m6b-calendar-surface.test.js
          tests/m9d-noi-hub.test.js
          tests/m10-attention-orbit.test.js
          tests/m12a-shell-motion.test.js
          tests/m10-2-push-regression.test.js
          tests/m10-daily-answer-push-regression.test.js
          tests/countdown-oggi-v1-db.test.js
          tests/f2a1-production-baseline.test.js
          tests/f2a2-ledger-reconciliation.test.js
          tests/f2c-edge-cron-source-truth.test.js
      - name: Full test suite
        run: npm test
      - name: Cloudflare Pages build
        run: npm run build:cloudflare-pages
      - name: Diff check
        run: git diff --check "${{ github.event.pull_request.base.sha }}..HEAD"

  capacitor_windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Capacitor web build
        run: npm run build:capacitor-web
