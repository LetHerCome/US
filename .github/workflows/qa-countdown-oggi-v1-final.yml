name: Countdown Oggi V1 final validation

on:
  push:
    branches:
      - qa/countdown-oggi-v1-final-validation

jobs:
  validate-web-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Add isolated Playwright runtime
        run: npm install --no-save --package-lock=false playwright@1.58.2
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Full test suite
        run: npm test -- --test-concurrency=1
      - name: Focused countdown browser
        run: node --test tests/countdown-oggi-v1-browser.test.js
      - run: npm run build:cloudflare-pages
      - name: Diff check candidate
        run: git diff --check c173abefe8e26fd57c78501724fd3743e4c84d8b f7ae7179b6e96308af77c5968c7e8791aa644e54
      - name: Ensure tracked source stayed clean
        run: git diff --exit-code

  validate-capacitor-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:capacitor-web
