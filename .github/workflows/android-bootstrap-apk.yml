name: Android bootstrap APK

on:
  push:
    branches:
      - mission/us-android-stable-updates-v1
    paths:
      - '.github/workflows/android-bootstrap-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Generate permanent signing identity for bootstrap install
        shell: bash
        run: |
          set -euo pipefail
          STORE_PASSWORD="$(openssl rand -hex 24)"
          KEY_PASSWORD="$(openssl rand -hex 24)"
          KEY_ALIAS="us-internal"
          KEYSTORE="$RUNNER_TEMP/us-internal-signing.jks"
          keytool -genkeypair -v             -keystore "$KEYSTORE"             -storetype JKS             -storepass "$STORE_PASSWORD"             -keypass "$KEY_PASSWORD"             -alias "$KEY_ALIAS"             -keyalg RSA -keysize 3072 -validity 10000             -dname "CN=US Internal, OU=US, O=US, L=Pescara, ST=Abruzzo, C=IT"

          VERSION_CODE="$(date -u +%s)"
          echo "US_ANDROID_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          echo "US_ANDROID_KEYSTORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "US_ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "US_ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "US_ANDROID_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "US_ANDROID_VERSION_NAME=1.0-internal.$VERSION_CODE" >> "$GITHUB_ENV"

          python - <<'PY'
          import os, json, base64
          from pathlib import Path
          p = Path(os.environ["RUNNER_TEMP"]) / "us-internal-signing.jks"
          bundle = {
              "keystoreBase64": base64.b64encode(p.read_bytes()).decode("ascii"),
              "storePassword": os.environ["STORE_PASSWORD"] if "STORE_PASSWORD" in os.environ else "",
              "keyAlias": "us-internal",
              "keyPassword": os.environ["KEY_PASSWORD"] if "KEY_PASSWORD" in os.environ else "",
          }
          # passwords are supplied below through a temporary env-safe file instead
          PY

          printf '%s' "$STORE_PASSWORD" > "$RUNNER_TEMP/store-pass.txt"
          printf '%s' "$KEY_PASSWORD" > "$RUNNER_TEMP/key-pass.txt"

      - name: Create encrypted signing handoff
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import os, json, base64
          from pathlib import Path
          temp = Path(os.environ["RUNNER_TEMP"])
          keystore = temp / "us-internal-signing.jks"
          bundle = {
              "keystoreBase64": base64.b64encode(keystore.read_bytes()).decode("ascii"),
              "storePassword": (temp / "store-pass.txt").read_text(),
              "keyAlias": "us-internal",
              "keyPassword": (temp / "key-pass.txt").read_text(),
          }
          encoded = base64.b64encode(json.dumps(bundle, separators=(",", ":")).encode()).decode()
          Path("out/ANDROID_SIGNING_BUNDLE_B64.txt").write_text(encoded)
          PY
          cat > "$RUNNER_TEMP/handoff.crt" <<'CERT'
-----BEGIN CERTIFICATE-----
