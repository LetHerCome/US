name: Android bootstrap APK

on:
  push:
    branches:
      - mission/us-android-stable-updates-v1
    paths:
      - '.github/workflows/android-bootstrap-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Generate permanent signing identity
        shell: bash
        run: |
          set -euo pipefail
          STORE_PASSWORD="$(openssl rand -hex 24)"
          KEY_PASSWORD="$(openssl rand -hex 24)"
          KEYSTORE="$RUNNER_TEMP/us-internal-signing.jks"

          keytool -genkeypair -v -keystore "$KEYSTORE" -storetype JKS             -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD"             -alias us-internal -keyalg RSA -keysize 3072 -validity 10000             -dname "CN=US Internal, OU=US, O=US, L=Pescara, ST=Abruzzo, C=IT"

          VERSION_CODE="$(date -u +%s)"
          echo "US_ANDROID_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          echo "US_ANDROID_KEYSTORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "US_ANDROID_KEY_ALIAS=us-internal" >> "$GITHUB_ENV"
          echo "US_ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "US_ANDROID_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "US_ANDROID_VERSION_NAME=1.0-internal.$VERSION_CODE" >> "$GITHUB_ENV"

          printf '%s' "$STORE_PASSWORD" > "$RUNNER_TEMP/store-pass.txt"
          printf '%s' "$KEY_PASSWORD" > "$RUNNER_TEMP/key-pass.txt"

      - name: Create encrypted signing handoff
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out

          python - <<'PY'
          import os, json, base64
          from pathlib import Path
          temp = Path(os.environ["RUNNER_TEMP"])
          bundle = {
              "keystoreBase64": base64.b64encode((temp / "us-internal-signing.jks").read_bytes()).decode("ascii"),
              "storePassword": (temp / "store-pass.txt").read_text(),
              "keyAlias": "us-internal",
              "keyPassword": (temp / "key-pass.txt").read_text(),
          }
          encoded = base64.b64encode(json.dumps(bundle, separators=(",", ":")).encode()).decode()
          Path("out/ANDROID_SIGNING_BUNDLE_B64.txt").write_text(encoded)
          PY

          echo '' | base64 -d > "$RUNNER_TEMP/handoff.crt"
          openssl cms -encrypt -binary -aes256             -in out/ANDROID_SIGNING_BUNDLE_B64.txt             -out out/ANDROID_SIGNING_BUNDLE_B64.cms             -outform DER "$RUNNER_TEMP/handoff.crt"

          rm out/ANDROID_SIGNING_BUNDLE_B64.txt "$RUNNER_TEMP/store-pass.txt" "$RUNNER_TEMP/key-pass.txt"

      - name: Install dependencies
        run: npm ci

      - name: Stage Capacitor web bundle
        run: npm run build:capacitor-web

      - name: Sync Android
        run: npx cap sync android

      - name: Build signed release APK
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Verify and package
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee out/signature.txt
          cp "$APK" out/US-Android.apk
          sha256sum out/US-Android.apk > out/US-Android.sha256.txt
          {
            echo "source_sha=$GITHUB_SHA"
            echo "application_id=com.usapp.us"
            echo "version_code=$US_ANDROID_VERSION_CODE"
            echo "version_name=$US_ANDROID_VERSION_NAME"
          } > out/US-Android-build-info.txt

      - uses: actions/upload-artifact@v4
        with:
          name: US-Android-Bootstrap
          path: out/
          if-no-files-found: error
          retention-days: 1
