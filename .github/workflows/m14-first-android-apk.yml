name: M14 First Android APK

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build_apk:
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 52a80a1da77d41c670c208f3df9893daf288078d
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install JS dependencies
        run: npm ci

      - name: Native foundation tests
        shell: pwsh
        run: |
          node --test tests/android-scaffold.test.js
          node --test tests/native-foundation.test.js
          node --test tests/native-web-staging.test.js
          node --test tests/native-back-platform.test.js
          node --test tests/native-back-navigation.test.js
          node --test tests/n3-android-brand-assets.test.js

      - name: Stage Capacitor web bundle
        run: npm run build:capacitor-web

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Assemble debug APK
        working-directory: android
        run: .\gradlew.bat --no-daemon :app:assembleDebug

      - name: Package install candidate
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item android/app/build/outputs/apk/debug/app-debug.apk out/US-M14-Android-Debug.apk
          $hash = (Get-FileHash out/US-M14-Android-Debug.apk -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  US-M14-Android-Debug.apk" | Set-Content out/US-M14-Android-Debug.sha256.txt
          @"
          source_sha=52a80a1da77d41c670c208f3df9893daf288078d
          application_id=com.usapp.us
          version_name=1.0
          version_code=1
          build_type=debug
          sha256=$hash
          "@ | Set-Content out/US-M14-build-info.txt
          Get-Item out/US-M14-Android-Debug.apk | Format-List Name,Length,LastWriteTime

      - uses: actions/upload-artifact@v4
        with:
          name: US-M14-Android-Debug
          path: out/
          if-no-files-found: error
          retention-days: 14
