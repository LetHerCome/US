name: Temporary Bencho Voice QA

on:
  push:
    branches:
      - feat/left-for-you-bencho-voice

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --check left-for-you.js
      - run: npm test
      - run: npm run build:cloudflare-pages
