name: QA iPhone viewport + local cosmetics

on:
  pull_request:
    branches: [main, fix/iphone13-default-cosmetics-viewport]
    paths:
      - 'progression.js'
      - 'fix4.css'
      - 'index.html'
      - 'manifest.webmanifest'
      - 'service-worker.js'
      - 'version.json'
      - 'tests/progression-rewards-v2.test.js'
      - 'tests/iphone-pwa-viewport.test.js'
      - '.github/workflows/qa-iphone-cosmetics-viewport.yml'

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Targeted regression
        run: node --test tests/progression-rewards-v2.test.js tests/iphone-pwa-viewport.test.js
      - name: Full suite
        run: npm test
      - name: Cloudflare Pages build
        run: npm run build:cloudflare-pages
