name: Android native validation

# Proves the Capacitor Android project compiles and its JVM unit tests pass on
# a clean runner, for branches other than main. Debug + unsigned release only:
# no keystore, no secrets, no upload. The signed internal APK stays owned by
# android-internal-release.yml (main only).

on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths:
      - 'tests/native-frameless-v1.test.js'
      - 'tests/centered-popups-v1.test.js'
      - 'tests/ricordi-carousel-v1.test.js'
      - 'tests/ricordi-inline-feed-v2.test.js'
      - 'ricordi-inline-carousel.js'
      - 'ricordi-inline-carousel.css'
      - 'ricordi-carousel.css'
      - 'modal-center.css'
      - 'android/**'
      - 'native-plugins/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - 'native-entry.mjs'
      - 'platform.js'
      - 'app.js'
      - 'tests/multicouple-foundation-v1.test.js'
      - 'tests/native-boot-auth-safety.test.js'
      - 'tests/beatrice-password-login.test.js'
      - 'tests/sec-rls-hardening.test.js'
      - 'styles.css'
      - 'moments-albums.js'
      - 'tests/native-performance-ux-v1.test.js'
      - 'app-lock.js'
      - 'app-lock.css'
      - 'notifications.js'
      - 'tests/native-notifications-v1-native.test.js'
      - 'tests/native-performance-ux-v1.test.js'
      - 'tests/ricordi-thumbnails-v1.test.js'
      - 'scripts/build-capacitor-web.mjs'
      - '.github/workflows/android-native-ci.yml'
  pull_request:
    paths:
      - 'tests/native-frameless-v1.test.js'
      - 'tests/centered-popups-v1.test.js'
      - 'tests/ricordi-carousel-v1.test.js'
      - 'tests/ricordi-inline-feed-v2.test.js'
      - 'ricordi-inline-carousel.js'
      - 'ricordi-inline-carousel.css'
      - 'ricordi-carousel.css'
      - 'modal-center.css'
      - 'android/**'
      - 'native-plugins/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - 'native-entry.mjs'
      - 'platform.js'
      - 'app.js'
      - 'tests/multicouple-foundation-v1.test.js'
      - 'tests/native-boot-auth-safety.test.js'
      - 'tests/beatrice-password-login.test.js'
      - 'tests/sec-rls-hardening.test.js'
      - 'settings.js'
      - 'index.html'
      - 'styles.css'
      - 'moments-albums.js'
      - 'supabase/functions/delete-moment/**'
      - 'supabase/migrations/**'
      - 'tests/native-performance-ux-v1.test.js'
      - 'tests/ricordi-thumbnails-v1.test.js'
      - 'tests/ricordi-delete-edge.test.js'
      - 'scripts/build-capacitor-web.mjs'
      - '.github/workflows/android-native-ci.yml'

permissions:
  contents: read

concurrency:
  group: android-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: npm ci
        run: npm ci

      - name: Native contract tests
        run: node --test tests/ricordi-inline-feed-v2.test.js tests/ricordi-carousel-v1.test.js tests/centered-popups-v1.test.js tests/native-frameless-v1.test.js tests/native-security-v1.test.js tests/android-scaffold.test.js tests/android-stable-signing.test.js tests/native-foundation.test.js tests/native-notifications-v1-native.test.js tests/native-performance-ux-v1.test.js tests/ricordi-thumbnails-v1.test.js tests/ricordi-delete-edge.test.js tests/multicouple-foundation-v1.test.js tests/native-boot-auth-safety.test.js tests/beatrice-password-login.test.js tests/sec-rls-hardening.test.js

      - name: npm run build:capacitor-web
        run: npm run build:capacitor-web

      - name: npx cap sync android
        run: npx cap sync android

      - name: Sync leaves committed Android project unchanged
        run: git diff --exit-code -- android

      - name: Gradle unit tests, debug and unsigned release builds
        working-directory: android
        run: bash ./gradlew --no-daemon testDebugUnitTest assembleDebug assembleRelease

      - name: Assert one effective guarded FCM receiver in Gradle merged manifest
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          source = Path('android/app/src/main/java/com/usapp/us/UsGuardedMessagingService.java')
          if not source.exists():
              print('Legacy branch without S3 receiver: no owner-gate requirement')
              raise SystemExit(0)
          build = Path('android/app/build/intermediates')
          manifests = sorted(set(build.rglob('AndroidManifest.xml')))
          parsed = []
          ns = '{http://schemas.android.com/apk/res/android}'
          for file in manifests:
              if 'manifest' not in str(file).lower():
                  continue
              try:
                  root = ET.parse(file).getroot()
              except ET.ParseError:
                  continue
              matches = []
              for service in root.findall('./application/service'):
                  for intent in service.findall('./intent-filter'):
                      if any(action.get(ns+'name')=='com.google.firebase.MESSAGING_EVENT' for action in intent.findall('action')):
                          matches.append(service.get(ns+'name'))
              if matches:
                  parsed.append((str(file), matches))
          if not parsed:
              raise SystemExit('FAIL: no merged manifest contains MESSAGING_EVENT')
          for file, services in parsed:
              print(file, services)
              if services != ['com.usapp.us.UsGuardedMessagingService']:
                  raise SystemExit('FAIL: FCM manifest is not exclusively owner-gated: '+str(services))
          print('PASS: every discovered merged FCM manifest uses exactly one guarded service')
          PY

      - name: Inspect built APKs
        run: |
          META=android/app/build/outputs/apk/debug/output-metadata.json
          cat "$META"
          grep -q '"applicationId": "com.usapp.us"' "$META"
          ls -la android/app/build/outputs/apk/debug android/app/build/outputs/apk/release
          test -f android/app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-reports
          path: |
            android/app/build/reports/tests/
            native-plugins/*/android/build/reports/tests/
            native-plugins/*/android/build/test-results/
          if-no-files-found: ignore
