name: iOS TestFlight testers (build already uploaded)

# By hand, for a build already in App Store Connect: wait for Apple's
# processing, add it to the TestFlight groups and send it to Beta App Review
# (scripts/ios-testflight-distribute.mjs). ios-testflight.yml does this by
# itself after each upload. Environment `ios-deploy`, from main only.

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Numero della build (CFBundleVersion, es. 461700)'
        type: string
        required: true
      what_to_test:
        description: 'Cosa provare (TestFlight), facoltativo'
        type: string
        default: ''
      solo_stato:
        description: 'Solo leggere lo stato su TestFlight, senza cambiare niente'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  testers:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ios-deploy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Give the build to the TestFlight testers
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}
          WHAT_TO_TEST: ${{ inputs.what_to_test }}
          ONLY_STATUS: ${{ inputs.solo_stato }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_P8_B64: ${{ secrets.APP_STORE_CONNECT_KEY_P8_B64 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/asc" && chmod 700 "$RUNNER_TEMP/asc"
          printf '%s' "$ASC_KEY_P8_B64" | base64 --decode > "$RUNNER_TEMP/asc/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/asc/AuthKey.p8"
          export ASC_KEY_PATH="$RUNNER_TEMP/asc/AuthKey.p8"
          if [ "$ONLY_STATUS" = "true" ]; then
            node scripts/ios-testflight-distribute.mjs --stato "$BUILD_NUMBER"
          else
            node scripts/ios-testflight-distribute.mjs "$BUILD_NUMBER" "$WHAT_TO_TEST"
          fi

      - name: Remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
