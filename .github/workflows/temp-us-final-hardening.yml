name: temp-us-final-hardening
on:
  push:
    branches:
      - gpt/us-perf-1-0-final-hardening

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Provide PowerShell compatibility alias for legacy asset tests
        if: runner.os == 'Linux'
        run: sudo ln -sf "$(command -v pwsh)" /usr/local/bin/powershell.exe
      - run: npm test
