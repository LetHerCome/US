name: F0.1 Windows verification

on:
  push:
    branches:
      - mission/us-2-0-f0-1-test-harness

jobs:
  windows-verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Target F0.1 regression suites
        run: >
          node --test
          tests/m9a-left-for-you-push-reliability.test.js
          tests/m10-daily-question-push.test.js
          tests/m11b-game-v2-editorial.test.js
          tests/m11c-game-v2-recipes.test.js
          tests/m11d-game-v2-push.test.js
          tests/n3-android-brand-assets.test.js
          tests/scriptable-widgets.test.js
      - name: Full test suite
        run: npm test
      - name: Cloudflare build
        run: npm run build:cloudflare-pages
      - name: Capacitor web build
        run: npm run build:capacitor-web
      - name: Working tree remains clean
        run: git diff --exit-code
