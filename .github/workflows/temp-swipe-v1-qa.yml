name: Temporary Swipe V1 QA

on:
  push:
    branches:
      - feat/swipe-v1

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --check games.js
      - run: npm test
      - run: npm run build:cloudflare-pages
