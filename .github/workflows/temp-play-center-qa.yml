name: Temporary Play Center QA

on:
  push:
    branches:
      - fix/voice-play-optical-center-v3

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test tests/left-for-you-bencho-voice.test.js
      - run: npm run build:cloudflare-pages
