name: F2A.1 independent review

on:
  push:
    branches:
      - mission/us-2-0-f2a-1-production-baseline

concurrency:
  group: f2a1-independent-review
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci
      - name: Baseline freshness
        run: node scripts/build-supabase-baseline.mjs --check
      - name: F2A.1 targeted tests
        run: node --test tests/f2a1-production-baseline.test.js
      - name: Full suite
        run: npm test
      - name: Diff check
        run: git diff --check
      - name: Clean tree
        run: git diff --exit-code
