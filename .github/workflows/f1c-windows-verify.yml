name: F1C Windows verification

on:
  push:
    branches:
      - mission/us-2-0-f1c-authority-rls-hardening

concurrency:
  group: f1c-windows-verify
  cancel-in-progress: true

jobs:
  windows-verify:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: F1 security suites
        run: >
          node --test
          tests/f1c-authority-write-boundaries.test.js
          tests/f1a-auth-shutdown.test.js
          tests/f1b-rpc-grant-hardening.test.js
      - name: Full test suite
        run: npm test
      - name: Cloudflare build
        run: npm run build:cloudflare-pages
      - name: Capacitor web build
        run: npm run build:capacitor-web
      - name: Working tree remains clean
        run: git diff --exit-code
