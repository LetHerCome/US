name: F2A verification

on:
  push:
    branches:
      - mission/us-2-0-f2a-backend-source-of-truth

concurrency:
  group: f2a-verify
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci
      - name: Cloudflare migration test
        run: node --test tests/cloudflare-pages-migration.test.js
      - name: Full suite
        run: npm test
      - name: Clean tree
        run: git diff --exit-code
