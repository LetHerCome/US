name: US UI polish regression

on:
  pull_request:
    paths:
      - 'index.html'
      - 'games.js'
      - 'games.css'
      - 'progression.js'
      - 'progression.css'
      - 'noi-v2.js'
      - 'noi-v2.css'
      - 'calendar.js'
      - 'oggi-look.js'
      - 'oggi-look.css'
      - 'navigation.js'
      - 'settings.js'
      - 'home-cleanup.js'
      - 'ui-foundation.css'
      - 'supabase/migrations/20261009100419_us_v3_oggi_looks_rewards.sql'
      - 'tests/us-v3-oggi-look.test.js'
      - 'tests/us-v3-noi-gioca.test.js'
      - 'tests/us-v3-rewards-db.test.js'
      - 'tests/gioca-tiles.test.js'
      - 'tests/us-gioca-v4-bento.test.js'
      - 'tests/us-reveal-calendar-clarity-v5.test.js'
      - 'tests/m10-2-daily-reactions.test.js'
      - 'tests/m12a-game-ricordi-motion.test.js'
      - 'tests/rewards-countdown-visual-pass.test.js'
      - 'tests/noi-v2-layout.test.js'
      - 'tests/us-noi-single-calendar-v4.test.js'
      - 'settings2.css'
      - 'tests/us-human-ui-02.test.js'
      - 'tests/progression-rewards-v2.test.js'
      - 'tests/us-progression-v1.test.js'
      - '.github/workflows/ui-polish-regression.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'games.js'
      - 'games.css'
      - 'progression.js'
      - 'progression.css'
      - 'noi-v2.js'
      - 'noi-v2.css'
      - 'calendar.js'
      - 'oggi-look.js'
      - 'oggi-look.css'
      - 'navigation.js'
      - 'settings.js'
      - 'home-cleanup.js'
      - 'ui-foundation.css'
      - 'supabase/migrations/20261009100419_us_v3_oggi_looks_rewards.sql'
      - 'tests/us-v3-oggi-look.test.js'
      - 'tests/us-v3-noi-gioca.test.js'
      - 'tests/us-v3-rewards-db.test.js'
      - 'tests/gioca-tiles.test.js'
      - 'tests/us-gioca-v4-bento.test.js'
      - 'tests/us-reveal-calendar-clarity-v5.test.js'
      - 'tests/m10-2-daily-reactions.test.js'
      - 'tests/m12a-game-ricordi-motion.test.js'
      - 'tests/rewards-countdown-visual-pass.test.js'
      - 'tests/noi-v2-layout.test.js'
      - 'tests/us-noi-single-calendar-v4.test.js'
      - 'settings2.css'
      - 'tests/us-human-ui-02.test.js'
      - 'tests/progression-rewards-v2.test.js'
      - 'tests/us-progression-v1.test.js'
      - '.github/workflows/ui-polish-regression.yml'

permissions:
  contents: read

jobs:
  ui-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Sintonia, Gioca and Settings regression
        run: node --test tests/us-reveal-calendar-clarity-v5.test.js tests/m10-2-daily-reactions.test.js tests/m12a-game-ricordi-motion.test.js tests/us-gioca-v4-bento.test.js tests/us-progression-v1.test.js tests/progression-rewards-v2.test.js tests/us-human-ui-02.test.js tests/m11b-game-v2-client.test.js tests/noi-v2-layout.test.js tests/gioca-tiles.test.js tests/swipe-v1.test.js tests/rewards-countdown-visual-pass.test.js tests/us-perf-1-0-precache.test.js
      - name: US V3 — Oggi looks, Noi cleanup, Gioca hierarchy, rewards migration (PGlite)
        run: node --test tests/us-noi-single-calendar-v4.test.js tests/us-v3-oggi-look.test.js tests/us-v3-noi-gioca.test.js tests/us-v3-rewards-db.test.js tests/countdown-oggi-v1-db.test.js tests/progression-rewards-v2-db.test.js
      - name: Cloudflare web bundle
        run: npm run build:cloudflare-pages
      - name: Capacitor web bundle
        run: npm run build:capacitor-web
