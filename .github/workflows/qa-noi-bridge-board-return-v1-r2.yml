name: QA Noi bridge and Lavagna return R2

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  linux_review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Focused Noi/Lavagna browser gates
        run: |
          node --test tests/pre-native-cleanup-browser.test.js
          node --test tests/us-home-cleanup-noi-board-daily-move.test.js
          node --test tests/navigation-soak-browser.test.js
          node --test tests/us-human-ui-02.test.js
      - name: Full suite
        run: npm test
      - name: Cloudflare build
        run: npm run build:cloudflare-pages
      - name: Diff check
        shell: bash
        run: git diff --check origin/main..e900178396396cb9824c6c9dbb917bd7d4b48920

  windows_capacitor:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e900178396396cb9824c6c9dbb917bd7d4b48920
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Capacitor web build on Windows
        run: npm run build:capacitor-web
