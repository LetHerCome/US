name: QA password-only auth

on:
  pull_request:
    branches: [main]
    paths:
      - 'app.js'
      - 'index.html'
      - 'service-worker.js'
      - 'version.json'
      - 'tests/beatrice-password-login.test.js'
      - '.github/workflows/qa-password-only-auth.yml'

permissions:
  contents: read

jobs:
  auth:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Password auth regression
        run: node --test tests/beatrice-password-login.test.js
      - name: Full suite
        run: npm test
      - name: Cloudflare Pages build
        run: npm run build:cloudflare-pages
