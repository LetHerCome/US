name: Temporary Noi Liquid QA

on:
  push:
    branches:
      - feat/noi-liquid-static-list

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test tests/noi-static-liquid-list.test.js tests/m9d-noi-hub.test.js
      - run: npm test
      - run: npm run build:cloudflare-pages
