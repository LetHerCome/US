name: QA shell countdown polish v1

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  linux_review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 07b829ed1d13f997e4b1c1097e4b858422113787
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Focused contracts
        run: |
          node --test tests/us-human-ui-02.test.js
          node --test tests/rewards-countdown-visual-pass.test.js
          node --test tests/countdown-oggi-v1.test.js
          node --test tests/countdown-oggi-v1-browser.test.js
          node --test tests/shell-countdown-polish-browser.test.js
      - name: Full suite
        run: npm test
      - name: Cloudflare build
        run: npm run build:cloudflare-pages
      - name: Diff check
        shell: bash
        run: git diff --check origin/main..07b829ed1d13f997e4b1c1097e4b858422113787

  windows_capacitor:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 07b829ed1d13f997e4b1c1097e4b858422113787
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Capacitor web build
        run: npm run build:capacitor-web
