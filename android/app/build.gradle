apply plugin: 'com.android.application'

def signingProperties = new Properties()
def signingPropertiesFile = rootProject.file('keystore.properties')
if (signingPropertiesFile.exists()) {
    signingPropertiesFile.withInputStream { signingProperties.load(it) }
}

def signingValue = { String envName, String propertyName ->
    def envValue = System.getenv(envName)
    if (envValue != null && !envValue.trim().isEmpty()) return envValue.trim()
    def propertyValue = signingProperties.getProperty(propertyName)
    return propertyValue == null ? null : propertyValue.trim()
}

def internalStorePath = signingValue('US_ANDROID_KEYSTORE_PATH', 'storeFile')
if (internalStorePath && !new File(internalStorePath).isAbsolute()) {
    internalStorePath = rootProject.file(internalStorePath).absolutePath
}
def internalStorePassword = signingValue('US_ANDROID_KEYSTORE_PASSWORD', 'storePassword')
def internalKeyAlias = signingValue('US_ANDROID_KEY_ALIAS', 'keyAlias')
def internalKeyPassword = signingValue('US_ANDROID_KEY_PASSWORD', 'keyPassword')
def internalSigningReady = [internalStorePath, internalStorePassword, internalKeyAlias, internalKeyPassword]
        .every { it != null && !it.toString().isEmpty() }

def configuredVersionCode = System.getenv('US_ANDROID_VERSION_CODE') ?: project.findProperty('US_ANDROID_VERSION_CODE') ?: '1'
def configuredVersionName = System.getenv('US_ANDROID_VERSION_NAME') ?: project.findProperty('US_ANDROID_VERSION_NAME') ?: '1.0'

android {
    namespace = "com.usapp.us"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.usapp.us"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode Integer.parseInt(configuredVersionCode.toString())
        versionName configuredVersionName.toString()
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (internalSigningReady) {
            internal {
                storeFile file(internalStorePath)
                storePassword internalStorePassword
                keyAlias internalKeyAlias
                keyPassword internalKeyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (internalSigningReady) {
                signingConfig signingConfigs.internal
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // Our guarded FirebaseMessagingService compiles in the app module;
    // Capacitor's own dependency is not exported to app compileClassPath.
    // Pin the same Firebase Messaging version as the Capacitor 8 plugin.
    implementation "com.google.firebase:firebase-messaging:25.0.1"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
