ext {
    capacitorVersion = System.getenv('CAPACITOR_VERSION')
}

apply plugin: 'com.android.library'

android {
    namespace = "com.usapp.widget"
    compileSdk = project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 36
    defaultConfig {
        minSdkVersion project.hasProperty('minSdkVersion') ? rootProject.ext.minSdkVersion : 26
        targetSdkVersion project.hasProperty('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 36
        versionCode 1
        versionName "1.0"
        // The widget gallery (src/androidTest): every widget drawn with a sample couple, for the previews.
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation project(':capacitor-android')
    // The widget contract/models are pure Java; JVM tests need a real org.json.
    testImplementation "junit:junit:${project.hasProperty('junitVersion') ? rootProject.ext.junitVersion : '4.13.2'}"
    testImplementation "org.json:json:20250517"
    androidTestImplementation "androidx.test.ext:junit:${project.hasProperty('androidxJunitVersion') ? rootProject.ext.androidxJunitVersion : '1.3.0'}"
    androidTestImplementation "androidx.test:runner:1.7.0"
}
