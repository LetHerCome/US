# US 2.0 F1A — Auth legacy shutdown. Only the properties declared here are
# managed by `supabase config push`; every other remote Auth setting is left
# unchanged. US is a private two-person app: email + password is the only
# login path, accounts are provisioned by the owner, never self-signed-up.
[auth]
site_url = "https://us-a33.pages.dev"
additional_redirect_urls = ["https://us-a33.pages.dev"]
enable_signup = false
enable_anonymous_sign_ins = false
# Only the retired anonymous -> email upgrade flow ever needed this.
enable_manual_linking = false

[auth.sms.twilio]
enabled = false

[functions.widget-device-token]
verify_jwt = true

[functions.widget-think-send]
verify_jwt = false

[functions.us-widget-state]
verify_jwt = false

[functions.widget-scriptable-setup]
verify_jwt = false

[functions.send-web-push]
verify_jwt = true

[functions.cleanup-left-for-you]
verify_jwt = false

[functions.calendar-reminders-worker]
verify_jwt = false

[functions.left-for-you-push-worker]
verify_jwt = false

[functions.daily-question-push-worker]
verify_jwt = false

[functions.game-v2-push]
verify_jwt = true

[functions.game-v2-push-worker]
verify_jwt = false

[functions.spotify-search]
verify_jwt = true

[functions.delete-moment]
verify_jwt = true
